name: Train and release model

on:
  push:
    branches: [main]
    paths:
      - training_data.csv
      - train_model.py
      - requirements.txt
      - .github/workflows/ci-cd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train linear regression model
        run: python train_model.py

      - name: Publish model to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" linear_model.txt --clobber
          else
            gh release create "$tag" linear_model.txt \
              --target "$GITHUB_SHA" \
              --title "Linear model $tag" \
              --notes "Model trained from training_data.csv by GitHub Actions."
          fi
